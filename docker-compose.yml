# Local stack: PostGIS + Martin vector tiles, plus Redis for the ingestion queues.
#
#   docker compose up -d
#   POSTGRES_URL=postgres://postgres:password@localhost:5433/db npm run seed:db
#   NEXT_PUBLIC_MARTIN_URL=http://localhost:3001 npm run dev
#
# The deployed demo runs none of these — it serves static GeoJSON from
# data/map-data.json via /api/sources/[id]/features. See mcp/README.md.
#
# The ingestion workers (services/ingest) run on the host against these, and
# share the same `db` — one database, one POSTGRES_URL. See plans/.

services:
  db:
    # imresamu/* is the multi-arch rebuild of postgis/postgis — the official
    # image publishes amd64 only, which won't run natively on Apple Silicon.
    image: imresamu/postgis:17-3.5-alpine
    restart: unless-stopped
    ports:
      # 5433 on the host — 5432 is commonly taken by a local Postgres install.
      - "5433:5432"
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # BullMQ's backing store. Redis owns the detection schedule, so it survives a
  # restart of whichever worker registered it — and multiple worker replicas
  # can register the same schedule without producing duplicate ticks.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly so a restart doesn't drop queued jobs on the floor.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for document originals and extracted text.
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO does not create buckets on boot and nothing else here does either.
  # One-shot, idempotent (`|| true`), runs on every `up`.
  #
  # The retry loop is not defensive padding: `depends_on` waits for the minio
  # *container* to start, not for the server inside it to accept connections,
  # and that race fails outright with `connection refused` without it.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 1;
      done &&
      mc mb -p local/ingest || true
      "

  martin:
    image: ghcr.io/maplibre/martin:1.16.0
    restart: unless-stopped
    # 3001 on the host — Next dev owns 3000.
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgres://postgres:password@db/db
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Named volumes, unlike db's ./pg_data bind mount — there is nothing in queue
  # state or object storage worth browsing from the host directly.
  redis_data:
  minio_data:
