# Local stack: PostGIS + Martin vector tiles, plus Redis for the ingestion queues.
#
#   docker compose up -d
#   POSTGRES_URL=postgres://postgres:password@localhost:5433/db npm run seed:db
#   NEXT_PUBLIC_MARTIN_URL=http://localhost:3001 npm run dev
#
# `db`'s data lives in ./pg_data (bind mount, gitignored) — `docker compose down -v`
# or deleting that directory wipes it. `npm run db:backup` / `db:restore` dump/restore
# just the app tables (not PostGIS's own tiger/topology schemas) to ./backups
# (gitignored), so the local db is safe to tear down and rebuild on demand.
#
# The deployed demo runs none of these — it serves static GeoJSON from
# data/map-data.json via /api/sources/[id]/features. See mcp/README.md.
#
# The ingestion workers (services/ingest) run on the host against these, and
# share the same `db` — one database, one POSTGRES_URL. See plans/.

services:
  db:
    # imresamu/* is the multi-arch rebuild of postgis/postgis — the official
    # image publishes amd64 only, which won't run natively on Apple Silicon.
    image: imresamu/postgis:17-3.5-alpine
    restart: unless-stopped
    ports:
      # 5433 on the host — 5432 is commonly taken by a local Postgres install.
      - "5433:5432"
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # BullMQ's backing store. Redis owns the detection schedule, so it survives a
  # restart of whichever worker registered it — and multiple worker replicas
  # can register the same schedule without producing duplicate ticks.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly so a restart doesn't drop queued jobs on the floor.
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for document originals and extracted text.
  #
  # Both minio/minio and minio/mc now require an authenticated pull on
  # Docker Hub *and* quay.io/minio/* — confirmed directly against each
  # registry's v2 API, not just inferred from a CI error. If a fresh pull
  # here starts failing with "unauthorized"/"pull access denied", that's
  # this, not a local misconfiguration; `docker login` to an account with
  # access is the only fix for local dev today. CI sidesteps it entirely —
  # see docker-compose.ci.yml.
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO does not create buckets on boot and nothing else here does either.
  # One-shot, idempotent (`|| true`), runs on every `up`.
  #
  # The retry loop is not defensive padding: `depends_on` waits for the minio
  # *container* to start, not for the server inside it to accept connections,
  # and that race fails outright with `connection refused` without it.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 1;
      done && mc mb -p local/ingest || true "

  martin:
    image: ghcr.io/maplibre/martin:1.16.0
    restart: unless-stopped
    # Tile cache OFF. Martin's cache is LRU-only — no TTL by default and no
    # invalidation — so any tile requested before a data change keeps being served
    # afterwards: pins for events that were deleted or re-ingested stay on the map
    # as "ghosts" with nothing to show on hover, and a pin vanishes at one zoom and
    # not another depending on which tiles were requested earlier. Reproduced
    # exactly: with the default cache a tile still held its 347 bytes of pins after
    # every event was deleted; with this flag it came back empty. A tile here is one
    # indexed query over a small table, so correctness costs nothing visible. (If a
    # large deployment needs the cache back, use `--cache-expiry` for bounded
    # staleness, and know pins can lag publishes by that long.)
    command: ["--cache-size", "0"]
    # 3001 on the host — Next dev owns 3000.
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgres://postgres:password@db/db
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Named volumes, unlike db's ./pg_data bind mount — there is nothing in queue
  # state or object storage worth browsing from the host directly.
  redis_data:
  minio_data:
