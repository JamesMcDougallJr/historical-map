name: E2E

on:
  pull_request:
  push:
    branches: [main]

env:
  POSTGRES_URL: postgres://postgres:password@localhost:5433/db
  NEXT_PUBLIC_MARTIN_URL: http://localhost:3001
  MAP_API_KEY: test-api-key
  NEXT_PUBLIC_MAP_API_KEY: test-api-key
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  S3_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_BUCKET: ingest
  ALLOW_TEST_DB_RESET: "1"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start docker services
        run: docker compose up -d db redis minio minio-init martin

      - name: Wait for Postgres, Redis, and MinIO
        run: |
          timeout 60 bash -c 'until docker compose exec -T db pg_isready -U postgres -d db; do sleep 2; done'
          timeout 60 bash -c 'until docker compose exec -T redis redis-cli ping; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 2; done'

      - name: Wait for Martin
        run: timeout 60 bash -c 'until curl -sf http://localhost:3001/catalog; do sleep 2; done'

      - name: Run ingest migrations
        run: npm run migrate --workspace=services/ingest

      - name: Build the MCP App bundle
        run: npm run build:mcp

      - name: Run the mocked E2E suite
        run: npm run test:e2e

      - name: Run the real-backend E2E suite
        run: npm run test:e2e:real

      - name: Run the ingestion fixture test
        env:
          EXTRACTION_ENGINE: fake
        run: npm run test:ingestion-fixture --workspace=services/ingest

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Tear down docker services
        if: always()
        run: docker compose down -v
