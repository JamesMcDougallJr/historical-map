name: Bedrock live

# The one place real Bedrock is called from CI (plans/23-search-semantic.md,
# row 19). Everything else runs EMBEDDING_ENGINE=fake. Credentials come from
# GitHub's OIDC token exchanged for the Terraform-managed role
# (infra/github-oidc.tf), which may invoke only Titan Embed v2 in
# BEDROCK_REGION — and the check below proves that by being refused anything
# else. No long-lived AWS secret exists in this repository.

on:
  schedule:
    - cron: "17 9 * * *" # nightly
  pull_request:
    paths:
      - "services/ingest/libs/embedding/**"
      - "services/ingest/scripts/verify-embeddings.ts"
      - ".github/workflows/bedrock-live.yml"
  workflow_dispatch:

permissions:
  id-token: write # the OIDC token the role trusts
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    # Fork PRs get no OIDC token for this repository's role; skip, don't fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assume the CI embeddings role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_EMBEDDINGS_ROLE_ARN }}
          aws-region: ${{ vars.BEDROCK_REGION }}

      - name: Live embedding check
        env:
          BEDROCK_REGION: ${{ vars.BEDROCK_REGION }}
        run: npm run embed:verify --workspace=services/ingest -- --live
