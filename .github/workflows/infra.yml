name: Infra

# Static checks for infra/ (OpenTofu): formatting, validation, and the
# mocked-provider plan tests in infra/tests — none needs cloud credentials.
# There's no `tofu plan` against the real account here: state is local by
# design (infra/versions.tf), so CI has nothing to diff against.
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]

jobs:
  tofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1

      - name: Format
        run: tofu fmt -check -recursive

      - name: Init (no backend, no credentials)
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate

      - name: Plan tests (mocked providers)
        run: tofu test
